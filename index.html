<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 Static Hosting Demo</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 48px 16px;
        background: #0b1220;
        color: #e8eefc;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.5;
        color: #c9d4f2;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(88, 160, 255, 0.18);
        border: 1px solid rgba(88, 160, 255, 0.35);
        margin-bottom: 18px;
        color: #b9d7ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="pill">AWS S3 Static Website Hosting</div>
      <h1>Hello from S3!</h1>
      <p>
        This page is meant to be served from an Amazon S3 bucket configured for
        <code>Static website hosting</code>.
      </p>
      <p>
        After you upload this file as <code>index.html</code>, your bucket’s index
        document should load automatically.
      </p>
    </div>
  </body>
</html>
